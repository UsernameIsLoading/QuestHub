{% extends 'base.html' %}{% block title %}Adicionar material — QuestHub{% endblock %}{% block content %}
<div class="page-heading"><div><div class="eyebrow">CONTRIBUA COM A COMUNIDADE</div><h1>Novo material<span class="heading-dot">.</span></h1><p>Associe recursos de estudo a um código de assunto, para que outras pessoas encontrem tudo junto.</p></div><a class="button secondary" href="{{ url_for('materials') }}">← Biblioteca</a></div>
<form method="post" class="panel form-panel"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="form-grid"><label>Código do assunto<input class="input" name="subject_code" required maxlength="8" pattern="[A-Za-z]{2,5}[0-9]{3}" placeholder="FIS003"><small>Use o mesmo código das questões.</small></label><label>Nome do assunto<input class="input" name="subject" required maxlength="100" placeholder="Eletromagnetismo"></label><label class="span-2">Título do material<input class="input" name="title" required maxlength="160" placeholder="Ex.: Introdução ao campo magnético"></label><label>Tipo de material<select class="input" name="kind" required><option value="link">Link externo</option><option value="video">Vídeo</option><option value="summary">Resumo</option><option value="formulas">Fórmulas</option></select></label><label class="span-2">URL externa (opcional)<input class="input" name="url" type="url" maxlength="1000" placeholder="https://..."><small>Use links de sites e vídeos que possam ser acessados legalmente.</small></label><label class="span-2">Resumo / notas<textarea class="input textarea" name="summary" rows="4" placeholder="Principais ideias, explicação breve ou pontos importantes..."></textarea></label><label class="span-2">Fórmulas principais<textarea class="input textarea" name="formulas" rows="4" placeholder="Ex.: F = q·v·B·sen(θ) — força magnética sobre carga em movimento"></textarea></label></div><div class="form-actions"><a class="clear-link" href="{{ url_for('materials') }}">Cancelar</a><button class="button primary" type="submit">Publicar material →</button></div></form>{% endblock %}
